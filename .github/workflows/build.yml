name: Build & Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          # Highlight-start
          cache-dependency-path: './flixie/package-lock.json'
          # Highlight-end

      - name: Install Dependencies
        working-directory: ./flixie
        run: npm ci

      - name: Check TypeScript
        working-directory: ./flixie
        run: npm run lint

      - name: Check campaign analytics
        working-directory: ./flixie
        run: npm run check:analytics

      - name: Compile and Build Assets
        working-directory: ./flixie
        run: npm run build

      - name: Verify generated SEO pages
        working-directory: ./flixie
        run: npm run check:seo

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "flixie/dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Job
        id: closejob
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

  notify_slack:
    needs: build_and_deploy_job
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Notify corporate site deployment result
        continue-on-error: true
        run: node scripts/slack/notify-ci.cjs
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          SLACK_EVENT_TITLE: Corporate site deployment — ${{ github.sha }}
          SLACK_EVENT_STATUS: ${{ needs.build_and_deploy_job.result }}
          SLACK_EVENT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
